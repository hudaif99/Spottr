name: spottr
description: "A new Flutter project to track workouts."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get_it: ^9.2.1
  equatable: ^2.0.8
  path_provider: ^2.1.5
  google_fonts: ^8.0.2
  intl: ^0.20.2
  uuid: ^4.5.3
  animated_list_plus: ^0.5.2
  file_picker: ^10.3.10
  share_plus: ^12.0.1
  archive: ^4.0.9
  wakelock_plus: ^1.4.0
  audioplayers: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_native_splash: ^2.4.3

flutter_native_splash:
  color: "#F2F2F7"       
  image: assets/ic/splash_light.png
  color_dark: "#111111"
  image_dark: assets/ic/splash_dark.png

  fullscreen: false
  android_12:
    color: "#F2F2F7"
    image: assets/ic/splash_light.png
    color_dark: "#111111"
    image_dark: assets/ic/splash_dark.png
    icon_background_color: "#F2F2F7"
    icon_background_color_dark: "#111111"


flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/ic/
