name: spottr
description: "A new Flutter project to track workouts."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get_it: ^9.2.1
  equatable: ^2.0.8
  path_provider: ^2.1.5
  intl: ^0.20.2
  uuid: ^4.5.3
  animated_list_plus: ^0.5.2
  file_picker: ^10.3.10
  share_plus: ^12.0.1
  archive: ^4.0.9
  wakelock_plus: ^1.4.0
  audioplayers: ^6.5.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_native_splash: ^2.4.3

flutter_native_splash:
  color: "#F2F2F7"       
  image: assets/ic/splash_light.png
  color_dark: "#111111"
  image_dark: assets/ic/splash_dark.png

  fullscreen: false
  android_12:
    color: "#F2F2F7"
    image: assets/ic/splash_light.png
    color_dark: "#111111"
    image_dark: assets/ic/splash_dark.png
    icon_background_color: "#F2F2F7"
    icon_background_color_dark: "#111111"


flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/ic/
    - assets/fonts/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Thin.ttf
          weight: 100
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
